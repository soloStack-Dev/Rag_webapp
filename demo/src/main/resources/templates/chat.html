<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>memInfo &middot; Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/meminfo.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/navbar :: navbar('chat')}"></header>

<main class="chat-layout container-fluid flex-grow-1 d-flex p-0">
  <aside class="chat-sidebar offcanvas-lg offcanvas-start border-end" tabindex="-1" id="chatSidebar"
         aria-label="Chat sidebar">
    <div class="offcanvas-header d-lg-none border-bottom">
      <span class="fw-bold">memInfo</span>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#chatSidebar"
              aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column p-0">

      <div class="p-2 border-bottom">
        <button id="new-chat-btn" type="button" class="btn btn-primary w-100"
                hx-post="/chat/new"
                hx-target="#chat-workspace"
                hx-swap="innerHTML"
                hx-indicator="#chat-indicator">+ New Chat</button>
      </div>

      <div class="flex-grow-1 overflow-auto">
        <div class="px-2 pt-2 pb-1 text-uppercase small fw-semibold text-muted">Chat History</div>
        <nav th:replace="~{fragments/history :: history}"></nav>
      </div>

      <div class="p-2 border-top">
        <label for="pdf-input" class="btn btn-outline-primary w-100">
          Source Upload
          <span id="upload-indicator" class="spinner-border spinner-border-sm" role="status"
                aria-hidden="true"></span>
        </label>
        <input type="file" id="pdf-input" class="d-none" accept="application/pdf"
           name="file"
               hx-post="/documents/upload"
               hx-encoding="multipart/form-data"
               hx-target="#documents-section"
               hx-swap="innerHTML"
               hx-trigger="change"
               hx-indicator="#upload-indicator">
        <div id="documents-section" class="mt-1">
          <div th:replace="~{fragments/documents :: documents}"></div>
        </div>
      </div>

    </div>
  </aside>

  <div class="chat-main flex-grow-1 d-flex flex-column position-relative bg-white">
    <div id="chat-indicator" role="status" aria-live="polite">
      <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
      <span>Searching your knowledge&hellip; Generating answer&hellip;</span>
    </div>
    <div id="chat-workspace" class="d-flex flex-column flex-grow-1 overflow-hidden">
      <div th:replace="~{fragments/workspace :: workspace}"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<script th:src="@{/js/chat.js}"></script>
</body>
</html>
