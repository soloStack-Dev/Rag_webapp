<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar(active)" class="navbar navbar-expand-md navbar-dark" style="background-color: #2563eb;">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">memInfo</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" th:classappend="${active == 'home'} ? 'active' : ''" th:href="@{/}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${active == 'about'} ? 'active' : ''" th:href="@{/about}">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:classappend="${active == 'chat'} ? 'active' : ''" th:href="@{/chat}">Chat</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
</body>
</html>
