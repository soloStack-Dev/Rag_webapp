spring.application.name=rag-app
server.port=${PORT:8080}

# .env is not natively read by Spring Boot 4; import it as a property source (optional so tests/fresh clones still start)
spring.config.import=optional:file:.env[.properties]

# --- MySQL ---
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ragapp}?useSSL=true&sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Gemini AI ---
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.temperature=0.3
spring.ai.google.genai.chat.max-output-tokens=2048
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}

# --- Chroma (cloud) ---
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:https://localhost}
spring.ai.vectorstore.chroma.client.port=443
spring.ai.vectorstore.chroma.client.key-token=${CHROMA_API_KEY:}
spring.ai.vectorstore.chroma.tenant-name=${CHROMA_TENANT:default}
spring.ai.vectorstore.chroma.database-name=${CHROMA_DATABASE:default_database}
spring.ai.vectorstore.chroma.collection-name=${CHROMA_COLLECTION:rag-app}
spring.ai.vectorstore.chroma.initialize-schema=true

# --- RAG tuning ---
rag.chunk-size=1000
rag.chunk-overlap=150
rag.top-k=4
rag.similarity-threshold=0.0

# --- Uploads ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Keep credentials out of logs
logging.level.org.apache.http=WARN
logging.level.org.springframework.ai=INFO